# ThermalAI - Configuration (TOML Format)
# Device: Generic / Universal
# Edit values here; changes take effect after restarting the daemon.

temp_cool = 42
temp_warm = 48
temp_hot = 58
temp_powersave = 68
temp_critical = 75

poll_interval = 2
game_poll_interval = 1
temp_history_size = 10
prediction_window = 5
policy_debounce_sec = 6
policy_debounce_gaming_sec = 15

log_level = "INFO"
# Logs are inherently truncated in-place every 2 hours to avoid disk spam.
# There is no size-based rotation.

gpu_gaming_threshold = 20
pkg_cache_ttl = 5
proc_scan_interval = 3
game_latch_sec = 45
gaming_score_boost = 35

# Experimental: enables a frame-timing-aware CPU frequency governor during
# active gaming, using real per-frame data (via dumpsys) where available and
# falling back to CPU load otherwise. Enabled by default as of v3.1.0-beta.
adaptive_governor_enabled = true

# Logs detailed battery/power statistics (temperature, drain rate, screen-on/off
# and deep-sleep/awake time) to a separate thermalai_battery.log file, for
# future debugging. Pure observability - does not affect device behavior.
# On by default.
battery_stats_enabled = true

# Minimum interval between two consecutive actuation bursts (governor /
# cpuset / GPU rewrites). Kills sub-second thrash after wake / game entry.
min_actuation_interval_ms = 1500

# Master off-switch for /proc/sys/net/ipv4/tcp_* writes. Off by default —
# TCP writes were the source of visible connectivity regressions in v3.1.0.
touch_network_stack = false

# Congestion control installed while gaming; "kernel_default" keeps the
# kernel's own pick (best for carrier NAT / captive portals).
tcp_congestion_control_gaming = "kernel_default"

# Number of consecutive unclean daemon exits before the next boot enters
# safe mode (disable_tweaks forced true; telemetry-only).
safe_mode_after_crashes = 2

# Watchdog failure count above which we escalate to a full snapshot restore.
watchdog_stall_threshold = 5

# v3.1.8: emit ftrace/atrace markers on policy transitions and
# actuation bursts. Requires /sys/kernel/tracing/trace_marker (or
# /sys/kernel/debug/tracing/trace_marker on older kernels) to be
# writable by root, which is true on all peridot kernels.
trace_markers_enabled = false

# v3.2.4: master switch for the advanced tuning pass — schedutil
# up/down rate limits, CFS/WALT responsiveness (sched_latency,
# min_granularity, migration_cost), cpuidle deep-state enable,
# zRAM lz4 compressor while gaming, F2FS gc_urgent + ipu_policy,
# and msm_performance touchboost / cpus_online powerhints.
# Every write is capability-probed and idempotent — safe on
# non-QCOM and non-Peridot devices.
advanced_tuning_enabled = true

# v3.2.29: Active network quality measurement for gaming.
# Runs detect_network_quality.sh on gaming session start and periodically.
# Measures RTT, jitter, packet loss for CODM bullet registration assessment.
network_diagnostics_enabled = true

# Compatibility wrapper for safe migration from legacy shell tweaks. Runtime
# WiFi low-latency mode and RPS are managed directly by GameTurbo; Android
# retains ownership of DNS, modem, IRQ, and queueing policy.
gaming_network_tweaks_enabled = true

# v3.2.29: Interval in seconds between active network quality re-probes
# during gaming. 0 = only probe once on session start.
network_probe_interval_sec = 30

# v3.7.6 Phase 0 ML — collect features for offline training (ml_features.jsonl).
# Shadow inference (manual MLP 8-16-8-1, 6K). Bundled model at config/ml_model.json.
ml_features_enabled = true
ml_shadow_enabled = true
ml_model_path = "/data/adb/modules/thermalai_rust/config/ml_model.json"
